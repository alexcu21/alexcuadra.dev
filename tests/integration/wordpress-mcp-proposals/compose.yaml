# Synthetic acceptance only. Exact guard hostname is used inside an internal network.
name: alexcuadra-editorial-proposals-acceptance
services:
  db:
    image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: synthetic-proposals-only
      MARIADB_ROOT_PASSWORD: synthetic-proposals-root-only
    volumes: ["db-data:/var/lib/mysql"]
    tmpfs: ["/archive:rw,size=64m,mode=0700"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
  wordpress:
    image: wordpress:7.1.3-php8.2-apache@sha256:7cb0b86fdd78760c741db2fde3ed7a10084029164009e2c41b09de32f54607e8
    environment: &env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: synthetic-proposals-only
      WORDPRESS_DB_NAME: wordpress
      AC_PROPOSALS_ACCEPTANCE: synthetic-v1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_HOME', 'https://content.alexcuadra.dev');
        define('WP_SITEURL', 'https://content.alexcuadra.dev');
        define('AC_EDITORIAL_PROPOSALS_SITE', 'https://content.alexcuadra.dev');
        define('DISABLE_WP_CRON', true);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('DISALLOW_FILE_MODS', true);
    volumes: &mounts
      - wp-data:/var/www/html
      - ./:/acceptance:ro
      - ../wordpress-mcp-changes:/base-tests:ro
      - ../../../wordpress/plugins/alexcuadra-editorial-proposals:/candidate-source:ro
      - ../../../artifacts/wordpress/alexcuadra-editorial-proposals-0.1.0-rc.1.zip:/candidate.zip:ro
      - ../../../docs/wordpress/acf-current-2026-10-18.json:/project-field-export.json:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php && test -f /var/www/html/wp-includes/version.php"]
      interval: 2s
      timeout: 3s
      retries: 30
  cli:
    image: wordpress:cli-php8.2@sha256:b99fac444f68b8d41b23c6496c7c036082d86a2f6a2b669217d0987a06ef775f
    entrypoint: ["wp"]
    user: "33:33"
    environment: *env
    volumes: *mounts
    profiles: [tools]
  seed:
    image: wordpress:7.1.3-php8.2-apache@sha256:7cb0b86fdd78760c741db2fde3ed7a10084029164009e2c41b09de32f54607e8
    entrypoint: ["sh", "/acceptance/seed.sh"]
    network_mode: none
    volumes:
      - seed-data:/seed:ro
      - wp-data:/target
      - ./:/acceptance:ro
      - ../../../wordpress/plugins/alexcuadra-editorial-proposals:/candidate-source:ro
    profiles: [tools]
networks:
  default:
    internal: true
volumes:
  seed-data:
    external: true
    name: ${EDITORIAL_PROPOSALS_SEED_VOLUME:-alexcuadra-editorial-application-lab_wp-data}
  db-data:
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=512m"}
  wp-data:
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=768m"}
