name: alexcuadra-blog-read-lab-20261026
services:
  db:
    image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: synthetic-blog-lab-only
      MARIADB_ROOT_PASSWORD: synthetic-blog-root-only
    volumes: ["db-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
  wordpress:
    image: wordpress:7.1.3-php8.5-apache@sha256:c12bed9c5af9d76261221c2af3a6216a074dd80b4fc2459588b3cbf2dd8e1798
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: synthetic-blog-lab-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('AC_EDITORIAL_BLOG_READ_LAB', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISABLE_WP_CRON', true);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('WP_ACCESSIBLE_HOSTS', 'wordpress');
    volumes: &wp-volumes
      - wp-data:/var/www/html
      - ./:/lab:ro
      - ../../../wordpress/experimental/editorial-blog-read:/blog-candidate:ro
      - ../../../node_modules/.cache/editorial-blog-read-lab:/lab-assets:ro
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php && test -f /var/www/html/wp-includes/version.php"]
      interval: 2s
      timeout: 3s
      retries: 30
  cli:
    image: wordpress:cli-php8.5@sha256:52d8832dc8b90022c22fe963e696e4107d86f68b9b891e9624d82fec94fdc3b7
    entrypoint: ["wp"]
    user: "33:33"
    environment: *wp-env
    volumes: *wp-volumes
    depends_on: [wordpress]
    profiles: [tools]
networks:
  default: { internal: true }
volumes:
  db-data:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=256m" }
  wp-data:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=256m" }
